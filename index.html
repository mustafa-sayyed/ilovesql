<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local-first SQL notebook that runs Postgres in your browser." />

    <!-- Open Graph meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ilovesql" />
    <meta property="og:title" content="ilovesql - a Postgres notebook in your browser" />
    <meta
      property="og:description"
      content="Find the story hidden in your data. A local-first SQL notebook with a real Postgres engine, schema explorer, and notes - all in one browser tab."
    />
    <meta property="og:image" content="https://ilovesql.mustafasayyed.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ilovesql - find the story hidden in your data" />

    <!-- Twitter meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ilovesql - a Postgres notebook in your browser" />
    <meta
      name="twitter:description"
      content="A local-first SQL notebook with a real Postgres engine, schema explorer, and notes - all in your browser."
    />
    <meta name="twitter:image" content="https://ilovesql.mustafasayyed.dev/og-image.png" />
    <meta name="twitter:image:alt" content="ilovesql - find the story hidden in your data" />
    <meta name="theme-color" content="#17161c" />

    
    <script>
      try {
        if (localStorage.getItem('ilovesql-theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      } catch {}
    </script>
    <title>ilovesql - a Postgres notebook in your browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
